name: Seed placement check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - content/placement-check.mjs
      - content/modules.mjs
      - content/modules-part2.mjs
      - content/modules-university.mjs
      - content/interest-tree.mjs
      - content/entrance-targets.mjs
      - content/knowledge-tree.mjs
      - content/modules-helios.mjs
      - content/modules-depth-width.mjs
      - lib/checkContent.mjs
      - lib/lateral.mjs
      - lib/checkModules.mjs
      - lib/checkInterestTree.mjs
      - lib/checkKnowledgeTree.mjs
      - lib/knowledgeTree.mjs
      - lib/passage.mjs
      - lib/records.mjs
      - scripts/seed-placement-check.js
      - .github/workflows/seed-placement-check.yml

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed catalog and modules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVIE_ACCOUNT_JSON }}
          # Do not wipe sitting progress on ordinary seeds (beta reset was one-shot).
          RESET_STUDENT_RESULTS: "0"
        run: node scripts/seed-placement-check.js
