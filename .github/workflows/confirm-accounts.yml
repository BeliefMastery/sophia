name: Confirm accounts

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/confirm-accounts.js
      - .github/workflows/confirm-accounts.yml

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm the logins and fill missing profile data
        env:
          # The Firebase secret was created under this spelling.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVIE_ACCOUNT_JSON }}
          SOPHIA_AUTH_EMAIL: ${{ secrets.SOPHIA_AUTH_EMAIL }}
          PARENT_AUTH_EMAIL: ${{ secrets.PARENT_AUTH_EMAIL }}
        run: node scripts/confirm-accounts.js
