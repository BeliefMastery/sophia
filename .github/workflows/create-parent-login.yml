name: Create parent login

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/create-parent-login.js
      - .github/workflows/create-parent-login.yml

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the parent login
        env:
          # The Firebase secret was created under this spelling.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVIE_ACCOUNT_JSON }}
          PARENT_AUTH_EMAIL: ${{ secrets.PARENT_AUTH_EMAIL }}
          PARENT_AUTH_PASSWORD: ${{ secrets.PARENT_AUTH_PASSWORD }}
        run: node scripts/create-parent-login.js
